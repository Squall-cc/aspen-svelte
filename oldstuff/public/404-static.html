<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sail - Scramjet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&display=swap" rel="stylesheet" />
    <script src="./sail/baremux/index.js"></script>
    <script src="./sail/scram/scramjet.all.js"></script>
    <script>
        navigator.serviceWorker.register(new URL('./', document.baseURI).pathname + "sail/sw.js")
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #fff; }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Readex Pro', sans-serif;
            color: #000;
        }
        h1 { font-size: 8rem; user-select: none; }
        iframe#frame {
            height: 100vh;
            width: 100vw;
            background: #cfcfcf;
            position: absolute;
            left: 0;
            top: 0;
            border: none;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <h1 id="placeholder">404</h1>

    <script>
        const params = new URLSearchParams(window.location.search);
        let url = (params.get("q") || "").trim();

        if (!url) {
            // no query → show 404 placeholder only
        } else {
            document.getElementById("placeholder").remove();

            const frame = document.createElement("iframe");
            frame.id = "frame";
            frame.frameBorder = "0";
            document.body.appendChild(frame);

            const base = new URL('./', document.baseURI).pathname;
            const connection = new BareMux.BareMuxConnection(base + "sail/baremux/worker.js");
            connection.setTransport(base + "sail/libcurl/index.mjs", [{ websocket: "wss://monaco-edu.online/wisp/" }]);

            const { ScramjetController } = $scramjetLoadController();
            const scramjet = new ScramjetController({
                files: {
                    all: base + "sail/scram/scramjet.all.js",
                    wasm: base + "sail/scram/scramjet.wasm.wasm",
                    sync: base + "sail/scram/scramjet.sync.js"
                },
                prefix: base + "sail/go/"
            });
            scramjet.init();

            if (!url.includes(".")) {
                url = "https://search.brave.com/search?q=" + encodeURIComponent(url);
            } else if (!url.startsWith("http://") && !url.startsWith("https://")) {
                url = "https://" + url;
            }
            frame.src = scramjet.encodeUrl(url);
        }
    </script>

</body>
</html>
