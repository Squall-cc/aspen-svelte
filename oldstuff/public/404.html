<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
		<title>404</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@160..700&display=swap" rel="stylesheet" />
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		<script src="register-sw.js"></script>
		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			html, body { height: 100%; background: #fff; }
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				font-family: 'Readex Pro', sans-serif;
				color: #000;
			}
			h1 { font-size: 8rem; user-select: none; }
			#loading {
				display: none;
				position: fixed;
				inset: 0;
				background: #3b4252;
				align-items: center;
				justify-content: center;
				font-family: 'Readex Pro', sans-serif;
				font-size: 13px;
				color: #e5e9f0;
				z-index: 1;
			}
			#sj-frame {
				position: fixed;
				top: 0; left: 0;
				width: 100%; height: 100%;
				border: none;
				z-index: 9999;
			}
		</style>
	</head>
	<body>
		<h1>404</h1>
		<div id="loading">loading...</div>
		<!-- imagine *not* skidding from scramjet-app-->
		<script>
			"use strict";

			// poll sj-frame title directly — more reliable than SW injection since scramjet rewrites parent
			let lastTitle = '';
			setInterval(() => {
				const frame = document.getElementById('sj-frame');
				if (!frame) return;
				try {
					const title = frame.contentDocument?.title;
					console.log('[proxy] getting title:', title, '| last:', lastTitle);
					if (title && title !== lastTitle) {
						lastTitle = title;
						console.log('[proxy] title changed, sending to tab layout:', title);
						parent.postMessage({ type: 'tab-title', title }, '*');
					}
				} catch (e) {
					console.log('[proxy] title poll error:', e.message);
				}
			}, 500);

			const params = new URLSearchParams(window.location.search);
			const url = params.get("q");
			if (url) {
				document.getElementById("loading").style.display = "flex";
			}

			const { ScramjetController } = $scramjetLoadController();
			const scramjet = new ScramjetController({
				files: {
					wasm: "/scram/scramjet.wasm.wasm",
					all: "/scram/scramjet.all.js",
					sync: "/scram/scramjet.sync.js",
				},
			});
			scramjet.init();
			const connection = new BareMux.BareMuxConnection("/baremux/worker.js");

			(async () => {
			if (!url) return;

			await scramjet.init(); 

			try {
				await registerSW();
			} catch (err) {
				console.error("failed to register service worker.", err);
				return;
			}

			const wispUrl = (location.protocol === "https:" ? "wss" : "ws") +
				"://" + location.host + "/wisp/";

			if ((await connection.getTransport()) !== "/libcurl/index.mjs") {
				await connection.setTransport("/libcurl/index.mjs", [{ websocket: wispUrl }]);
			}

			const frame = scramjet.createFrame();
			frame.frame.id = "sj-frame";
			document.body.appendChild(frame.frame);
			frame.go(url);
			})();
		</script>
	</body>
</html>
