<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>failed to load</title>
		<style>
			body {
				margin: 0;
				height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #fff;
				color: #222;
				font-family: system-ui, sans-serif;
			}
			main {
				text-align: center;
			}
			h1 {
				font-size: 18px;
				margin: 0 0 8px;
			}
			p {
				color: #777;
				font-size: 13px;
				margin: 0 0 16px;
			}
			button {
				padding: 6px 16px;
				font-size: 13px;
				border-radius: 8px;
				border: 1px solid #ccc;
				background: #fff;
				cursor: pointer;
			}
			button:hover {
				border-color: #888;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>failed to load</h1>
			<p>the proxy didn't respond to this request</p>
			<button onclick="location.reload()">try again</button>
		</main>
	</body>
</html>
